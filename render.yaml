# Render Blueprint for Universal Healthcare Frontend
# Browser calls always go to same-origin /api/v1 (mobile-safe auth cookies).
# Set NEXT_PUBLIC_API_URL (or BACKEND_API_URL) to your deployed backend, e.g.:
#   https://universal-healthcare-backend.onrender.com/api/v1
# Set NEXT_PUBLIC_APP_URL to this frontend URL, e.g.:
#   https://universal-healthcare-frontend.onrender.com
#
# Free-plan services sleep after ~15 minutes idle. Opening the frontend URL
# only wakes this service. The app pings BACKEND_API_URL /health on boot
# (instrumentation.ts + /api/wake). To prevent sleep entirely, ping both
# https://<frontend>/api/wake and https://<backend>/health every 5–10 minutes
# (UptimeRobot, cron-job.org, etc.).

services:
  - type: web
    name: universal-healthcare-frontend
    runtime: bun
    plan: free
    buildCommand: bun install && bun run build
    startCommand: bun run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: BACKEND_API_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
